spring:
  application:
    name: wedit-server
  profiles:
    active: local

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081
  ai:
    be-a:
      base-url: http://localhost:8000
    be-b:
      base-url: http://localhost:8001
  mission:
    generation:
      enabled: false
      cron: "0 0 5 * * *"
      zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health

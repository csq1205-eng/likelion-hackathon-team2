spring:
  application:
    name: wedit-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081
  ai:
    internal-key: ${INTERNAL_API_KEY:}
    be-a:
      base-url: ${APP_AI_BE_A_BASE_URL:http://localhost:8001}
    be-b:
      base-url: ${APP_AI_BE_B_BASE_URL:http://localhost:8002}
  mission:
    generation:
      enabled: false
      cron: "0 0 5 * * *"
      zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health
